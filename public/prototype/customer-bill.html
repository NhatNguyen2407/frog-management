<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />

    <title>Frog Customer Bill - 76 x 130 mm</title>
    <link rel="stylesheet" href="./customer-bill.css" />

  </head>
  <body>
    <div class="toolbar">
      <button id="print" type="button" disabled>In bill 76 × 130 mm</button>
